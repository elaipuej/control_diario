<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173F5F">
<title>Control Diario</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f9;color:#173F5F}
header{background:#173F5F;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-inner{max-width:760px;margin:auto}h1{margin:0;font-size:23px}.subtitle{margin-top:4px;opacity:.8;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}
select,input,button{width:100%;font:inherit;border-radius:10px}
select,input{border:1px solid #ccd7e0;padding:11px;background:#fff}input[type=number]{text-align:center}
button{border:0;padding:13px;cursor:pointer;font-weight:bold}.btn-primary{background:#1976D2;color:#fff}.btn-secondary{background:#e9eef3;color:#173F5F;margin-top:8px}
.progress-wrap{height:9px;background:#e5edf3;border-radius:20px;overflow:hidden;margin-top:10px}.progress{height:100%;width:0;background:#2EAD68;transition:width .2s}
.progress-info{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:#657786}
.section-title{font-size:15px;font-weight:bold;margin-bottom:8px}.product{border:1px solid #e2e9ee;border-radius:12px;padding:13px;margin-bottom:10px}
.product-name{font-weight:bold;font-size:14px;margin-bottom:10px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.field-title{font-size:10px;font-weight:bold;color:#657786;text-align:center;margin-bottom:4px}.fields input{padding:9px 5px}
.message{margin-top:12px;padding:11px;border-radius:10px;display:none;font-size:13px}.success{background:#e8f7ef;color:#19724a}.warning{background:#fff4df;color:#8a5a00}
.history-row{padding:9px 0;border-bottom:1px solid #edf1f4;font-size:13px}.muted{color:#657786;font-size:12px}
@media(max-width:480px){main{padding:10px}.card{padding:13px}.fields{gap:5px}.fields input{font-size:14px;padding:9px 3px}}

.dashboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.metric{background:#f7fafc;border:1px solid #e5edf3;border-radius:12px;padding:11px}
.metric-label{font-size:10px;font-weight:bold;color:#657786;text-transform:uppercase}
.metric-value{font-size:22px;font-weight:bold;margin-top:4px;color:#173F5F}
.metric-sub{font-size:11px;color:#657786;margin-top:2px}
.dashboard-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.dashboard-table th,.dashboard-table td{padding:8px 6px;border-bottom:1px solid #edf1f4;text-align:right}
.dashboard-table th:first-child,.dashboard-table td:first-child{text-align:left}
.dashboard-table th{font-size:10px;text-transform:uppercase;color:#657786}
.small-btn{width:auto;padding:9px 12px;font-size:12px;margin-top:8px}
.calc-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.calc-box{background:#f7fafc;border:1px solid #e5edf3;border-radius:9px;padding:8px;text-align:center}
.calc-title{font-size:9px;color:#657786;font-weight:bold;text-transform:uppercase}
.calc-value{font-weight:bold;font-size:13px;margin-top:3px}
@media(max-width:480px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.dashboard-table{font-size:11px}.dashboard-table th,.dashboard-table td{padding:7px 4px}}

.comparison-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.comparison-card{border:1px solid #e2e9ee;border-radius:12px;padding:12px;background:#fff}
.comparison-title{font-size:14px;font-weight:bold;margin-bottom:4px}
.comparison-note{font-size:11px;color:#657786;margin-bottom:8px}
.comparison-table{width:100%;border-collapse:collapse;font-size:12px}
.comparison-table th,.comparison-table td{padding:8px 6px;border-bottom:1px solid #edf1f4;text-align:right;vertical-align:middle}
.comparison-table th:first-child,.comparison-table td:first-child{text-align:left}
.comparison-table th{font-size:10px;text-transform:uppercase;color:#657786}
.bar-wrap{height:7px;background:#e8eef3;border-radius:10px;overflow:hidden;min-width:70px}
.bar{height:100%;background:#1976D2;border-radius:10px}
@media(max-width:480px){.comparison-table{font-size:11px}.comparison-table th,.comparison-table td{padding:7px 4px}.bar-wrap{min-width:45px}}

.date-range-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.range-summary{margin-top:8px;font-size:12px;color:#657786;background:#f7fafc;border:1px solid #e5edf3;border-radius:10px;padding:9px}
.range-select{margin-top:2px}
@media(max-width:480px){.date-range-row{grid-template-columns:1fr 1fr}}

.top10-chart{margin-top:14px}.chart-wrap{display:flex;flex-direction:column;gap:9px;margin-top:10px}.chart-row{display:grid;grid-template-columns:minmax(150px,1.7fr) minmax(90px,3fr) 52px;gap:8px;align-items:center}.chart-label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart-track{height:20px;background:#edf2f6;border-radius:7px;overflow:hidden}.chart-fill{height:100%;background:#1976D2;border-radius:7px;min-width:2px}.chart-value{text-align:right;font-size:12px;font-weight:bold}.chart-empty{padding:14px;border:1px dashed #d7e1e8;border-radius:10px;color:#657786;font-size:12px}
@media(max-width:480px){.chart-row{grid-template-columns:minmax(120px,1.5fr) minmax(70px,2fr) 45px;gap:6px}.chart-label{font-size:10px}.chart-value{font-size:11px}}
.tools-card .tool-link{display:block;text-decoration:none;text-align:center;border-radius:10px;padding:13px;margin-top:10px;font-weight:bold}.primary-link{background:#1976D2;color:#fff}.tools-card .tool-link:hover{filter:brightness(.97)}
</style>
</head>
<body>
<header><div class="header-inner"><h1>Control Diario</h1><div class="subtitle">Registro diario de productos · Datos compartidos</div></div></header>
<main>
<section class="card">
<label for="fecha">Fecha</label><input id="fecha" type="date">
<label for="usuario">Usuario</label>
<select id="usuario"><option value="">Seleccionar usuario...</option><option>Ana</option><option>Luis</option><option>María</option><option>Juan</option><option>Pedro</option></select>
</section>
<section class="card">
<div class="section-title">Progreso del control</div>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div class="progress-info"><span id="progressText">0 productos</span><span id="progressPercent">0%</span></div>
</section>

<section class="card"><div class="section-title">Productos</div><div id="productos"></div></section>
<section class="card">
<button class="btn-primary" onclick="guardarControl()">GUARDAR CONTROL</button>
<button class="btn-secondary" onclick="limpiarFormulario()">Limpiar formulario</button>
<div id="mensaje" class="message"></div>
</section>

<section class="card tools-card">
  <div class="section-title">Herramientas</div>
  <div class="muted">El análisis, historial y exportación están en una página separada para mantener este formulario rápido y limpio.</div>
  <a class="tool-link primary-link" href="dashboard.html">📊 Abrir Dashboard</a>
</section>
</main>
<script>
const SUPABASE_URL = "https://dsgjwaovruukvlezcdnp.supabase.co";
const SUPABASE_KEY = "sb_publishable_6hvO0W5rYKVpSgGuWBXnTA_J8CtzfqS";
const API = SUPABASE_URL + "/rest/v1";
const headers = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };

let PRODUCTOS = [];
let USUARIOS = [];
const fechaInput = document.getElementById("fecha");
const usuarioInput = document.getElementById("usuario");
const productosContainer = document.getElementById("productos");

function fechaLocalISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function supabaseGet(path){const r=await fetch(API+path,{headers});if(!r.ok)throw new Error(await r.text()||(`HTTP ${r.status}`));return r.json();}

fechaInput.value=fechaLocalISO();

async function cargarDatosIniciales(){
  try{
    PRODUCTOS=await supabaseGet("/productos?activo=eq.true&order=orden.asc");
    USUARIOS=await supabaseGet("/usuarios?activo=eq.true&order=nombre.asc");
    usuarioInput.innerHTML='<option value="">Seleccionar usuario...</option>'+USUARIOS.map(u=>`<option value="${u.id}">${escapeHtml(u.nombre)}</option>`).join("");
    crearProductos(); actualizarProgreso(); actualizarCalculos(); await cargarControlExistente();
  }catch(error){console.error(error);mostrarMensaje("No se ha podido conectar con la base de datos: "+error.message,"warning");}
}

function crearProductos(){
  productosContainer.innerHTML="";
  PRODUCTOS.forEach((p,i)=>{
    const b=document.createElement("div"); b.className="product";
    b.innerHTML=`<div class="product-name">${i+1}. ${escapeHtml(p.nombre)}</div>
      <div class="fields">
        <div><div class="field-title">INICIAL</div><input type="number" min="0" step="1" data-producto="${p.id}" data-campo="inicial" inputmode="numeric"></div>
        <div><div class="field-title">REPOSICIÓN</div><input type="number" min="0" step="1" data-producto="${p.id}" data-campo="reposicion" inputmode="numeric"></div>
        <div><div class="field-title">SOBRANTE</div><input type="number" min="0" step="1" data-producto="${p.id}" data-campo="sobrante" inputmode="numeric"></div>
        <div><div class="field-title">MERMA</div><input type="number" min="0" step="1" data-producto="${p.id}" data-campo="merma" inputmode="numeric"></div>
      </div>
      <div class="calc-row">
        <div class="calc-box"><div class="calc-title">Consumo</div><div class="calc-value" data-calculo="consumo" data-producto="${p.id}">0</div></div>
        <div class="calc-box"><div class="calc-title">% Merma</div><div class="calc-value" data-calculo="mermaPct" data-producto="${p.id}">0,00%</div></div>
      </div>`;
    productosContainer.appendChild(b);
  });
}

function calcularProducto(id){
  const get=c=>{const el=document.querySelector(`[data-producto="${id}"][data-campo="${c}"]`);return el?Number(el.value)||0:0;};
  const inicial=get("inicial"), reposicion=get("reposicion"), sobrante=get("sobrante"), merma=get("merma");
  const base=inicial+reposicion, consumo=base-sobrante, pct=base>0?(merma/base)*100:0;
  const ce=document.querySelector(`[data-calculo="consumo"][data-producto="${id}"]`);
  const me=document.querySelector(`[data-calculo="mermaPct"][data-producto="${id}"]`);
  if(ce)ce.textContent=String(consumo); if(me)me.textContent=pct.toFixed(2).replace('.',',')+'%';
}
function actualizarCalculos(){PRODUCTOS.forEach(p=>calcularProducto(p.id));}
function actualizarProgreso(){
  let n=0; PRODUCTOS.forEach(p=>{const ok=["inicial","reposicion","sobrante","merma"].some(c=>{const el=document.querySelector(`[data-producto="${p.id}"][data-campo="${c}"]`);return el&&el.value!=="";});if(ok)n++;});
  const pct=Math.round((n/(PRODUCTOS.length||1))*100); document.getElementById("progress").style.width=pct+"%";document.getElementById("progressText").textContent=`${n} / ${PRODUCTOS.length} productos`;document.getElementById("progressPercent").textContent=pct+"%";
}

document.addEventListener("input",()=>{actualizarProgreso();actualizarCalculos();});
fechaInput.addEventListener("change",cargarControlExistente);
usuarioInput.addEventListener("change",cargarControlExistente);

function obtenerRegistros(){
  const fecha=fechaInput.value, usuarioId=Number(usuarioInput.value), out=[];
  PRODUCTOS.forEach(p=>{
    const get=c=>{const el=document.querySelector(`[data-producto="${p.id}"][data-campo="${c}"]`);return el?el.value:"";};
    const inicial=get("inicial"), reposicion=get("reposicion"), sobrante=get("sobrante"), merma=get("merma");
    if([inicial,reposicion,sobrante,merma].some(v=>v!=="")) out.push({fecha,usuario_id:usuarioId,producto_id:p.id,inicial:Number(inicial)||0,reposicion:Number(reposicion)||0,sobrante:Number(sobrante)||0,merma:Number(merma)||0});
  }); return out;
}

async function cargarControlExistente(){
  if(!fechaInput.value||!usuarioInput.value||!PRODUCTOS.length)return;
  try{
    const rows=await supabaseGet(`/registros?select=producto_id,inicial,reposicion,sobrante,merma&fecha=eq.${encodeURIComponent(fechaInput.value)}&usuario_id=eq.${encodeURIComponent(usuarioInput.value)}`);
    document.querySelectorAll('input[type="number"]').forEach(i=>i.value="");
    const map=Object.fromEntries(rows.map(r=>[String(r.producto_id),r]));
    PRODUCTOS.forEach(p=>{const r=map[String(p.id)];if(!r)return;["inicial","reposicion","sobrante","merma"].forEach(c=>{const el=document.querySelector(`[data-producto="${p.id}"][data-campo="${c}"]`);if(el)el.value=r[c]??0;});});
    actualizarProgreso();actualizarCalculos();
    if(rows.length)mostrarMensaje(`Se han cargado ${rows.length} productos registrados para esta fecha y usuario.` ,"success");
    else document.getElementById("mensaje").style.display="none";
  }catch(e){console.error(e);mostrarMensaje("No se pudo cargar el control existente: "+e.message,"warning");}
}

async function guardarControl(){
  if(!fechaInput.value){mostrarMensaje("Selecciona una fecha.","warning");return;}
  if(!usuarioInput.value){mostrarMensaje("Selecciona el usuario.","warning");return;}
  const registros=obtenerRegistros(); if(!registros.length){mostrarMensaje("Introduce al menos un producto.","warning");return;}
  const boton=document.querySelector(".btn-primary");boton.disabled=true;boton.textContent="GUARDANDO...";
  try{
    const r=await fetch(API+"/registros?on_conflict=fecha,usuario_id,producto_id",{method:"POST",headers:{...headers,"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(registros)});
    const body=await r.text(); if(!r.ok)throw new Error(`HTTP ${r.status}: ${body||"Error desconocido"}`);
    let rows=[];try{rows=body?JSON.parse(body):[]}catch{}
    if(!Array.isArray(rows)||rows.length===0)throw new Error("Supabase no confirmó ninguna fila.");
    mostrarMensaje(`✓ Guardado correctamente: ${rows.length} producto${rows.length===1?"":"s"}.`,"success");
  }catch(e){console.error(e);mostrarMensaje("No se pudo guardar: "+e.message,"warning");}
  finally{boton.disabled=false;boton.textContent="GUARDAR CONTROL";}
}
function mostrarMensaje(t,tipo){const m=document.getElementById("mensaje");m.textContent=t;m.className="message "+tipo;m.style.display="block";}
function limpiarFormulario(){if(!confirm("¿Quieres borrar lo introducido en este formulario?"))return;document.querySelectorAll('input[type="number"]').forEach(i=>i.value="");actualizarProgreso();actualizarCalculos();document.getElementById("mensaje").style.display="none";}
cargarDatosIniciales();
</script>
</body>
</html>
