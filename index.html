<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173F5F">
<title>Control Diario</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f9;color:#173F5F}
header{background:#173F5F;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-inner{max-width:760px;margin:auto}h1{margin:0;font-size:23px}.subtitle{margin-top:4px;opacity:.8;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}
select,input,button{width:100%;font:inherit;border-radius:10px}
select,input{border:1px solid #ccd7e0;padding:11px;background:#fff}input[type=number]{text-align:center}
button{border:0;padding:13px;cursor:pointer;font-weight:bold}.btn-primary{background:#1976D2;color:#fff}.btn-secondary{background:#e9eef3;color:#173F5F;margin-top:8px}
.progress-wrap{height:9px;background:#e5edf3;border-radius:20px;overflow:hidden;margin-top:10px}.progress{height:100%;width:0;background:#2EAD68;transition:width .2s}
.progress-info{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:#657786}
.section-title{font-size:15px;font-weight:bold;margin-bottom:8px}.product{border:1px solid #e2e9ee;border-radius:12px;padding:13px;margin-bottom:10px}
.product-name{font-weight:bold;font-size:14px;margin-bottom:10px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.field-title{font-size:10px;font-weight:bold;color:#657786;text-align:center;margin-bottom:4px}.fields input{padding:9px 5px}
.message{margin-top:12px;padding:11px;border-radius:10px;display:none;font-size:13px}.success{background:#e8f7ef;color:#19724a}.warning{background:#fff4df;color:#8a5a00}
.history-row{padding:9px 0;border-bottom:1px solid #edf1f4;font-size:13px}.muted{color:#657786;font-size:12px}
@media(max-width:480px){main{padding:10px}.card{padding:13px}.fields{gap:5px}.fields input{font-size:14px;padding:9px 3px}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>Control Diario</h1><div class="subtitle">Registro diario de productos</div></div></header>
<main>
<section class="card">
<label for="fecha">Fecha</label><input id="fecha" type="date">
<label for="usuario">Usuario</label>
<select id="usuario"><option value="">Seleccionar usuario...</option><option>Ana</option><option>Luis</option><option>María</option><option>Juan</option><option>Pedro</option></select>
</section>
<section class="card">
<div class="section-title">Progreso del control</div>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div class="progress-info"><span id="progressText">0 productos</span><span id="progressPercent">0%</span></div>
</section>
<section class="card"><div class="section-title">Productos</div><div id="productos"></div></section>
<section class="card">
<button class="btn-primary" onclick="guardarControl()">GUARDAR CONTROL</button>
<button class="btn-secondary" onclick="limpiarFormulario()">Limpiar formulario</button>
<div id="mensaje" class="message"></div>
</section>
<section class="card">
<div class="section-title">Últimos controles guardados en este dispositivo</div>
<div id="historial"><div class="muted">No hay controles guardados todavía.</div></div>
<button class="btn-secondary" onclick="exportarCSV()">Exportar CSV</button>
</section>
</main>
<script>
/* ================================
   CONEXIÓN CON SUPABASE
   ================================ */
const SUPABASE_URL = "https://dsgjwaovruukvlezcdnp.supabase.co";
const SUPABASE_KEY = "sb_publishable_6hvO0W5rYKVpSgGuWBXnTA_J8CtzfqS";

const API = SUPABASE_URL + "/rest/v1";
const headers = {
  "apikey": SUPABASE_KEY,
  "Content-Type": "application/json"
};

let PRODUCTOS = [];
let USUARIOS = [];

const fechaInput = document.getElementById("fecha");
const usuarioInput = document.getElementById("usuario");
const productosContainer = document.getElementById("productos");

fechaInput.value = new Date().toISOString().slice(0,10);

async function supabaseGet(path) {
  const r = await fetch(API + path, { headers });
  if (!r.ok) {
    const error = await r.text();
    throw new Error(error || ("Error HTTP " + r.status));
  }
  return r.json();
}

async function cargarDatosIniciales() {
  try {
    PRODUCTOS = await supabaseGet("/productos?activo=eq.true&order=orden.asc");
    USUARIOS = await supabaseGet("/usuarios?activo=eq.true&order=nombre.asc");

    usuarioInput.innerHTML =
      '<option value="">Seleccionar usuario...</option>' +
      USUARIOS.map(u => `<option value="${u.id}">${escapeHtml(u.nombre)}</option>`).join("");

    crearProductos();
    actualizarProgreso();
    await mostrarHistorial();

  } catch (error) {
    console.error(error);
    mostrarMensaje(
      "No se ha podido conectar con la base de datos. Comprueba la conexión a Supabase.",
      "warning"
    );
  }
}

function crearProductos() {
  productosContainer.innerHTML = "";

  PRODUCTOS.forEach((producto, indice) => {
    const bloque = document.createElement("div");
    bloque.className = "product";

    bloque.innerHTML = `
      <div class="product-name">${indice + 1}. ${escapeHtml(producto.nombre)}</div>
      <div class="fields">
        <div>
          <div class="field-title">INICIAL</div>
          <input type="number" min="0" step="1"
                 data-producto="${producto.id}"
                 data-campo="inicial"
                 inputmode="numeric">
        </div>
        <div>
          <div class="field-title">REPOSICIÓN</div>
          <input type="number" min="0" step="1"
                 data-producto="${producto.id}"
                 data-campo="reposicion"
                 inputmode="numeric">
        </div>
        <div>
          <div class="field-title">SOBRANTE</div>
          <input type="number" min="0" step="1"
                 data-producto="${producto.id}"
                 data-campo="sobrante"
                 inputmode="numeric">
        </div>
        <div>
          <div class="field-title">MERMA</div>
          <input type="number" min="0" step="1"
                 data-producto="${producto.id}"
                 data-campo="merma"
                 inputmode="numeric">
        </div>
      </div>`;
    productosContainer.appendChild(bloque);
  });
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function actualizarProgreso() {
  let completados = 0;

  PRODUCTOS.forEach(producto => {
    const ok = ["inicial","reposicion","sobrante","merma"].some(c => {
      const el = document.querySelector(
        `[data-producto="${producto.id}"][data-campo="${c}"]`
      );
      return el && el.value !== "";
    });

    if (ok) completados++;
  });

  const total = PRODUCTOS.length || 1;
  const p = Math.round(completados / total * 100);

  document.getElementById("progress").style.width = p + "%";
  document.getElementById("progressText").textContent =
    `${completados} / ${PRODUCTOS.length} productos`;
  document.getElementById("progressPercent").textContent = p + "%";
}

document.addEventListener("input", actualizarProgreso);

function obtenerRegistros() {
  const fecha = fechaInput.value;
  const usuarioId = Number(usuarioInput.value);
  const out = [];

  PRODUCTOS.forEach(producto => {
    const get = campo => {
      const el = document.querySelector(
        `[data-producto="${producto.id}"][data-campo="${campo}"]`
      );
      return el ? el.value : "";
    };

    const inicial = get("inicial");
    const reposicion = get("reposicion");
    const sobrante = get("sobrante");
    const merma = get("merma");

    if ([inicial, reposicion, sobrante, merma].some(v => v !== "")) {
      out.push({
        fecha,
        usuario_id: usuarioId,
        producto_id: producto.id,
        inicial: Number(inicial) || 0,
        reposicion: Number(reposicion) || 0,
        sobrante: Number(sobrante) || 0,
        merma: Number(merma) || 0
      });
    }
  });

  return out;
}

async function guardarControl() {
  if (!fechaInput.value) {
    mostrarMensaje("Selecciona una fecha.", "warning");
    return;
  }

  if (!usuarioInput.value) {
    mostrarMensaje("Selecciona el usuario.", "warning");
    return;
  }

  const registros = obtenerRegistros();

  if (!registros.length) {
    mostrarMensaje("Introduce al menos un producto.", "warning");
    return;
  }

  const boton = document.querySelector(".btn-primary");
  boton.disabled = true;
  boton.textContent = "GUARDANDO...";

  try {
    const respuesta = await fetch(API + "/registros?on_conflict=fecha,usuario_id,producto_id", {
      method: "POST",
      headers: {
        ...headers,
        "Prefer": "resolution=merge-duplicates,return=representation"
      },
      body: JSON.stringify(registros)
    });

    const cuerpo = await respuesta.text();

    if (!respuesta.ok) {
      throw new Error("HTTP " + respuesta.status + ": " + (cuerpo || "Error desconocido"));
    }

    let filasGuardadas = [];
    try { filasGuardadas = cuerpo ? JSON.parse(cuerpo) : []; } catch (_) {}

    if (!Array.isArray(filasGuardadas) || filasGuardadas.length === 0) {
      throw new Error("Supabase respondió sin confirmar ninguna fila guardada.");
    }

    mostrarMensaje(
      "✓ Supabase confirmó el guardado de " + filasGuardadas.length + " productos.",
      "success"
    );

    await mostrarHistorial();

  } catch (error) {
    console.error(error);
    mostrarMensaje(
      "No se pudo guardar: " + error.message,
      "warning"
    );
  } finally {
    boton.disabled = false;
    boton.textContent = "GUARDAR CONTROL";
  }
}

function mostrarMensaje(texto, tipo) {
  const m = document.getElementById("mensaje");
  m.textContent = texto;
  m.className = "message " + tipo;
  m.style.display = "block";
}

function limpiarFormulario() {
  if (!confirm("¿Quieres borrar lo introducido en este formulario?")) return;

  document
    .querySelectorAll('input[type="number"]')
    .forEach(i => i.value = "");

  actualizarProgreso();
  document.getElementById("mensaje").style.display = "none";
}

async function mostrarHistorial() {
  const h = document.getElementById("historial");

  try {
    const registros = await supabaseGet(
      "/registros?select=fecha,usuario_id&order=creado_en.desc&limit=200"
    );

    const nombres = Object.fromEntries(
      USUARIOS.map(u => [u.id, u.nombre])
    );

    const grupos = {};

    registros.forEach(r => {
      const nombre = nombres[r.usuario_id] || "Usuario";
      const k = r.fecha + " · " + nombre;
      grupos[k] = (grupos[k] || 0) + 1;
    });

    const keys = Object.keys(grupos).slice(0, 10);

    h.innerHTML = keys.length
      ? keys.map(k =>
          `<div class="history-row">
             <strong>${escapeHtml(k)}</strong><br>
             <span class="muted">${grupos[k]} productos registrados</span>
           </div>`
        ).join("")
      : '<div class="muted">No hay controles guardados todavía.</div>';

  } catch (error) {
    console.error(error);
    h.innerHTML =
      '<div class="muted">No se ha podido cargar el historial.</div>';
  }
}

async function exportarCSV() {
  try {
    const registros = await supabaseGet(
      "/registros?select=fecha,hora,usuario_id,producto_id,inicial,reposicion,sobrante,merma,observaciones&order=fecha.asc,hora.asc"
    );

    if (!registros.length) {
      alert("No hay registros para exportar.");
      return;
    }

    const usuarios = Object.fromEntries(
      USUARIOS.map(u => [u.id, u.nombre])
    );

    const productos = Object.fromEntries(
      PRODUCTOS.map(p => [p.id, p.nombre])
    );

    const columnas = [
      "fecha","hora","usuario","producto",
      "inicial","reposicion","sobrante","merma",
      "consumo","mermaPorcentaje","observaciones"
    ];

    const filas = registros.map(r => {
      const base = r.inicial + r.reposicion;
      const consumo = base - r.sobrante;
      const mermaPorcentaje = base > 0 ? r.merma / base : 0;

      return [
        r.fecha,
        r.hora || "",
        usuarios[r.usuario_id] || "",
        productos[r.producto_id] || "",
        r.inicial,
        r.reposicion,
        r.sobrante,
        r.merma,
        consumo,
        mermaPorcentaje,
        r.observaciones || ""
      ];
    });

    const csv = [
      columnas.join(";"),
      ...filas.map(f =>
        f.map(v =>
          String(v ?? "")
            .replaceAll(";", ",")
            .replaceAll("\n", " ")
        ).join(";")
      )
    ].join("\n");

    const blob = new Blob(["\ufeff" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "control_diario.csv";
    a.click();
    URL.revokeObjectURL(a.href);

  } catch (error) {
    console.error(error);
    alert("No se ha podido exportar el CSV.");
  }
}

cargarDatosIniciales();
</script>
</body>
</html>
